name: WebUI RU laboratory ZIP (no release)

on:
  # Manual switch: only a commit editing this laboratory workflow on ru starts a run.
  push:
    branches:
      - ru
    paths:
      - '.github/workflows/webui-ru-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ru-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package WebUI RU
    if: github.ref == 'refs/heads/ru'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: UTC

    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Russian locale
        run: node scripts/check-locales.mjs

      - name: Validate stage5 account actions and delivery display invariants
        run: node scripts/check-schema-locale.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate Stalwart manifest
        run: |
          test -f dist/stalwart-app.json
          node --input-type=commonjs -e '
            const m = require("./dist/stalwart-app.json");
            const p = require("./package.json");
            if (m.id !== "webui" || m.version !== p.version ||
                m.minServerVersion !== p.stalwart.minServerVersion) {
              throw new Error("Incompatible generated WebUI manifest");
            }
            console.log(JSON.stringify(m));
          '

      - name: Archive dist contents and print SHA-256
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -exec touch -t 198001010000 {} +
          (
            cd dist
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -q ../webui.zip
          )
          unzip -Z -1 webui.zip | grep -Fx 'stalwart-app.json'
          sha256sum webui.zip | tee webui.sha256
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Manifest:' >> "$GITHUB_STEP_SUMMARY"
          cat dist/stalwart-app.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'ZIP SHA-256:' >> "$GITHUB_STEP_SUMMARY"
          cat webui.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload laboratory artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: webui-ru-${{ github.sha }}
          path: |
            webui.zip
            webui.sha256
          retention-days: 7
          if-no-files-found: error
