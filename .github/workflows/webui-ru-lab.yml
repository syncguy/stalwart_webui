name: WebUI RU laboratory ZIP (no release)

on:
  # Stage36: package verified stage35 catalog (7360023d262ede43fba96166204c57f8d5776553).
  # Stage40: laboratory package of accepted stage39 (f58cc0f6df6b48665765427c32bf1bb864588ed5).
  # Stage45: control package of accepted stage44 (d488fb8fee2131548ff43d899ba10c4f338d97b7).
  # Stage47 interim: operator feedback on dashboard labels, grammatical cases and clipping.
  # Stage47: correct grammar test syntax and refresh exact reviewed source hashes.
  # Stage47 retry: restore complete useFormTitle model destructuring.
  # Stage47-11: isolated adaptive RU Overview rejection ranking grid.
  # Stage48: one control ZIP after coverage PASS for reviewed two-parent WebUI 2.1.1 merge 9445e9ad.
  # Stage49: one final control ZIP after coverage run 45915843606 PASS on exact Astra 012 integration 8596971.
  # Stage50: one control ZIP after coverage run 45957340684 PASS on exact editorial batch ab03aca5197de73bc32c368308fd580c4b6e625a.
  # Stage50 second pass: one laboratory ZIP after coverage 46007368330 PASS on f41d6586d9e0eac20a00d814d4d2e560ce3258a3.
  # Stage50 third pass: one laboratory ZIP after coverage 46166613103 PASS on 5b6123f01c4816f4121ad45189c7ba206ffff78d.
  # Manual switch: only a commit editing this laboratory workflow on ru starts a run.
  push:
    branches:
      - ru
    paths:
      - '.github/workflows/webui-ru-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ru-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package WebUI RU
    if: github.ref == 'refs/heads/ru'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: UTC

    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Russian locale
        run: node scripts/check-locales.mjs

      - name: Validate pinned schema, all report views, pagination and prior display invariants
        run: node scripts/check-schema-locale.mjs

      - name: Validate display-name and raw-ID dropdown search invariants
        run: node scripts/check-option-labels.mjs

      - name: Validate tenant quota and full permission-display inventory
        run: node scripts/check-stage11-permissions.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate Stalwart manifest
        run: |
          test -f dist/stalwart-app.json
          node --input-type=commonjs -e '
            const m = require("./dist/stalwart-app.json");
            const p = require("./package.json");
            if (m.id !== "webui" || m.version !== p.version ||
                m.minServerVersion !== p.stalwart.minServerVersion) {
              throw new Error("Incompatible generated WebUI manifest");
            }
            console.log(JSON.stringify(m));
          '

      - name: Archive dist contents and print SHA-256
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -exec touch -t 198001010000 {} +
          (
            cd dist
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -q ../webui.zip
          )
          unzip -Z -1 webui.zip | grep -Fx 'stalwart-app.json'
          sha256sum webui.zip | tee webui.sha256
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Manifest:' >> "$GITHUB_STEP_SUMMARY"
          cat dist/stalwart-app.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'ZIP SHA-256:' >> "$GITHUB_STEP_SUMMARY"
          cat webui.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload laboratory artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: webui-ru-${{ github.sha }}
          path: |
            webui.zip
            webui.sha256
          retention-days: 7
          if-no-files-found: error
