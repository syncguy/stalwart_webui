name: WebUI RU offline coverage (no ZIP, no release)

on:
  push:
    branches: [ru]
    paths:
      - '.github/workflows/webui-ru-coverage.yml'
      - 'scripts/generate-locale-coverage.mjs'
      - 'scripts/check-coverage-inventory.mjs'
      - 'scripts/generate-locale-candidates.mjs'
      - 'scripts/check-locale-candidates.mjs'
      - 'scripts/check-locale-components.mjs'
      - 'scripts/check-schema-locale.mjs'
      - 'scripts/data/stage18-address-calendar-review.json'
      - 'scripts/lib/locale-*.mjs'
      - 'scripts/lib/offline-guard.mjs'
      - 'scripts/data/locale-review-policy.json'
      - 'scripts/schema-glossary.ru.json'
      - 'scripts/data/pinned-schema-manifest.json'
      - 'scripts/data/pinned-schema*.b64'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ru-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Verify pinned schema inventory without packaging
    if: github.ref == 'refs/heads/ru'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Node.js 22 (locked project dependencies)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install pinned TypeScript parser
        run: npm ci
      - name: Classify pinned sources and propose candidates with networking blocked
        env:
          NODE_OPTIONS: '--import=./scripts/lib/offline-guard.mjs'
        run: node scripts/generate-locale-candidates.mjs
      - name: Validate independent source and catalog expectations
        run: node scripts/check-coverage-inventory.mjs
      - name: Check classification, conflicts, source changes and contextual candidates
        env:
          NODE_OPTIONS: '--import=./scripts/lib/offline-guard.mjs'
        run: node scripts/check-locale-candidates.mjs
      - name: Check previous locale and renderer regressions without packaging
        run: |
          node scripts/check-locales.mjs
          node scripts/check-schema-locale.mjs
          node scripts/check-option-labels.mjs
          node scripts/check-stage11-permissions.mjs
      - name: Synthetic React SSR and raw identity contracts (no browser or server)
        env:
          NODE_OPTIONS: '--import=./scripts/lib/offline-guard.mjs'
        run: node scripts/check-locale-components.mjs
      - name: TypeScript check for shared display-only components
        run: npm run typecheck
      - name: ESLint check for TypeScript sources
        run: npm run lint
      - name: Verify deterministic repeat output
        env:
          NODE_OPTIONS: '--import=./scripts/lib/offline-guard.mjs'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .artifacts/locale-coverage/{inventory.json,summary.md,translation-memory.json} > /tmp/locale-coverage.sha256
          sha256sum .artifacts/locale-candidates/{classification.json,candidates.json,diff.json,summary.md,review.md} > /tmp/locale-candidates.sha256
          node scripts/generate-locale-candidates.mjs > /tmp/second-inventory.log
          sha256sum -c /tmp/locale-coverage.sha256
          sha256sum -c /tmp/locale-candidates.sha256
      - name: Publish summary and exact source SHA
        shell: bash
        run: |
          echo "Source SHA: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          head -n 40 .artifacts/locale-candidates/summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload report only, no WebUI ZIP
        uses: actions/upload-artifact@v4
        with:
          name: webui-ru-coverage-${{ github.sha }}
          path: |
            .artifacts/locale-coverage/
            .artifacts/locale-candidates/
          if-no-files-found: error
          retention-days: 7
